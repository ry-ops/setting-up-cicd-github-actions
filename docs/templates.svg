<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Workflows and stack templates</title>
  <desc id="d">Three live workflows (ci.yml, cd.yml, security-scan.yml) plus ready-to-use templates for Python, Docker and Kubernetes under examples.</desc>
  <defs><linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#2088FF"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e8eef5; }
    .muted { fill:#8795a8; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes g0 { 0%,2.50% { opacity:0; transform:translateY(8px) } 10.00%,100% { opacity:1; transform:translateY(0) } } .g0 { animation:g0 8.0s infinite; }
    @keyframes g1 { 0%,5.25% { opacity:0; transform:translateY(8px) } 12.75%,100% { opacity:1; transform:translateY(0) } } .g1 { animation:g1 8.0s infinite; }
    @keyframes g2 { 0%,8.00% { opacity:0; transform:translateY(8px) } 15.50%,100% { opacity:1; transform:translateY(0) } } .g2 { animation:g2 8.0s infinite; }
    @keyframes g3 { 0%,10.75% { opacity:0; transform:translateY(8px) } 18.25%,100% { opacity:1; transform:translateY(0) } } .g3 { animation:g3 8.0s infinite; }
    @keyframes g4 { 0%,13.50% { opacity:0; transform:translateY(8px) } 21.00%,100% { opacity:1; transform:translateY(0) } } .g4 { animation:g4 8.0s infinite; }
    @keyframes g5 { 0%,16.25% { opacity:0; transform:translateY(8px) } 23.75%,100% { opacity:1; transform:translateY(0) } } .g5 { animation:g5 8.0s infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; opacity:1 !important; transform:none !important; } }
  </style>
  <rect width="960" height="400" rx="20" fill="#0d1117"/>
  <text x="40" y="54" font-size="26" font-weight="800" style="fill:url(#title)">Copy, customize, ship</text>
  <text x="42" y="80" font-size="14" class="muted">Three working workflows and three stack templates — lift them into any repo.</text>
  <g class="g0"><rect x="40" y="116" width="410" height="78" rx="11" fill="#111923" stroke="#2088FF" stroke-opacity=".5"/>
  <circle cx="60" cy="144" r="5" fill="#2088FF"/>
  <text x="74" y="149" font-size="14" font-weight="800" class="mono">ci.yml</text>
  <rect x="370" y="132" width="62" height="20" rx="10" fill="#132418"/><text x="401" y="146" text-anchor="middle" font-size="10" font-weight="700" style="fill:#7ee6a0">live</text>
  <text x="60" y="174" font-size="11" class="muted">Lint → test (Node 18 &amp; 20) → build + coverage, on every PR</text></g><g class="g1"><rect x="480" y="116" width="410" height="78" rx="11" fill="#111923" stroke="#43c777" stroke-opacity=".5"/>
  <circle cx="500" cy="144" r="5" fill="#43c777"/>
  <text x="514" y="149" font-size="14" font-weight="800" class="mono">cd.yml</text>
  <rect x="810" y="132" width="62" height="20" rx="10" fill="#132418"/><text x="841" y="146" text-anchor="middle" font-size="10" font-weight="700" style="fill:#7ee6a0">live</text>
  <text x="500" y="174" font-size="11" class="muted">Build → staging + smoke tests → production, on merge to main</text></g><g class="g2"><rect x="40" y="208" width="410" height="78" rx="11" fill="#111923" stroke="#8b5cf6" stroke-opacity=".5"/>
  <circle cx="60" cy="236" r="5" fill="#8b5cf6"/>
  <text x="74" y="241" font-size="14" font-weight="800" class="mono">security-scan.yml</text>
  <rect x="370" y="224" width="62" height="20" rx="10" fill="#132418"/><text x="401" y="238" text-anchor="middle" font-size="10" font-weight="700" style="fill:#7ee6a0">live</text>
  <text x="60" y="266" font-size="11" class="muted">npm audit · Snyk · Trivy — weekly cron + on push/PR</text></g><g class="g3"><rect x="480" y="208" width="410" height="78" rx="11" fill="#111923" stroke="#3776AB" stroke-opacity=".5"/>
  <circle cx="500" cy="236" r="5" fill="#3776AB"/>
  <text x="514" y="241" font-size="14" font-weight="800" class="mono">examples/python-ci.yml</text>
  <rect x="810" y="224" width="62" height="20" rx="10" fill="#1b2430"/><text x="841" y="238" text-anchor="middle" font-size="10" font-weight="700" style="fill:#8795a8">template</text>
  <text x="500" y="266" font-size="11" class="muted">Flask/Django CI with pytest</text></g><g class="g4"><rect x="40" y="300" width="410" height="78" rx="11" fill="#111923" stroke="#2496ED" stroke-opacity=".5"/>
  <circle cx="60" cy="328" r="5" fill="#2496ED"/>
  <text x="74" y="333" font-size="14" font-weight="800" class="mono">examples/docker-build.yml</text>
  <rect x="370" y="316" width="62" height="20" rx="10" fill="#1b2430"/><text x="401" y="330" text-anchor="middle" font-size="10" font-weight="700" style="fill:#8795a8">template</text>
  <text x="60" y="358" font-size="11" class="muted">Multi-stage build + push, image optimization</text></g><g class="g5"><rect x="480" y="300" width="410" height="78" rx="11" fill="#111923" stroke="#326CE5" stroke-opacity=".5"/>
  <circle cx="500" cy="328" r="5" fill="#326CE5"/>
  <text x="514" y="333" font-size="14" font-weight="800" class="mono">examples/k8s-deploy.yml</text>
  <rect x="810" y="316" width="62" height="20" rx="10" fill="#1b2430"/><text x="841" y="330" text-anchor="middle" font-size="10" font-weight="700" style="fill:#8795a8">template</text>
  <text x="500" y="358" font-size="11" class="muted">Kubernetes rolling deployment</text></g>
</svg>
